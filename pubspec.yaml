name: flux_form
description: >-
  A modular, type-safe form management library. Features input aggregation, sanitization pipelines,
  declarative validation, smart UI error handling, and State-management agnostic.
version: 0.4.0

repository: https://github.com/puntbyte/flux_form
homepage: https://github.com/puntbyte/flux_form
issue_tracker: https://github.com/puntbyte/flux_form/issues

topics:
  - form
  - validation
  - state-management
  - sanitization
  - productivity

environment:
  sdk: ^3.10.0

dependencies:
  meta: ^1.16.0

dev_dependencies:
  test: ^1.26.0
  very_good_analysis: ^10.0.0