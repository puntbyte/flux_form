name: example
description: >-
  Flux Form feature showcase — demonstrates every library API across 6 focused
  screens: Login, Registration Wizard, Edit Profile, Booking, Search, Inventory.

publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # The package under demonstration (path dependency for local development).
  flux_form:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true